<!doctype html><html lang="es"><meta charset="utf-8"><title>Verificación de IA</title><body><h1>Verificación de posiciones de ajedrez</h1><p>Motor completo · habilidad máxima · posiciones reales</p><button id="run">Analizar posiciones</button><pre id="result" role="status">Preparado</pre><script type="module">
import {stockfishMove} from '/src/features/games/chess/stockfish.ts';import {newGameState,applyMove} from '/src/features/games/chess/chessEngine.ts';import {fromUci,toFen} from '/src/features/games/chess/uciPosition.ts';
const button=document.getElementById('run'),output=document.getElementById('result');button.onclick=async()=>{button.disabled=true;output.textContent='Iniciando…';const positions=[['Inicio',[]],['Medio juego',['e2e4','e7e5','g1f3','b8c6','f1b5','a7a6','b5a4','g8f6','e1g1','f8e7','f1e1','b7b5','a4b3','d7d6','c2c3','e8g8','h2h3','c6b8','d2d4','b8d7']]];try{for(const [name,moves] of positions){const state=newGameState();for(const text of moves){const move=fromUci(state,text);if(!move)throw Error('Secuencia de prueba inválida: '+text);applyMove(state,move.r,move.c,move)}const start=performance.now();output.textContent+='\nAnalizando '+name+'…';const move=await stockfishMove(state,100,{engine:'full',strict:true});if(!move)throw Error('No se obtuvo movimiento');const text='abcdefgh'[move.c]+(move.r+1)+'abcdefgh'[move.toC]+(move.toR+1)+(move.promotionPiece||'');if(!fromUci(state,text))throw Error('Movimiento ilegal');output.textContent+='\nOK · '+name+' · '+text+' · '+Math.round(performance.now()-start)+' ms\n'+toFen(state)}output.textContent+='\nFINALIZADO · 2 posiciones legales';}catch(error){output.textContent+='\nERROR: '+error.message}finally{button.disabled=false}}
</script></body></html>
